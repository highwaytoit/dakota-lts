self-hosted-runner:
  labels:
    - dakota-worker

paths:
  # actionlint v1.7.12 predates GitHub-hosted Ubuntu 26.04 runner labels.
  '.github/workflows/**/*.{yml,yaml}':
    ignore:
      - 'label "ubuntu-26\.04(-arm)?" is unknown\.'

  # build-aarch64 is intentionally disabled while webkit cold-builds OOM/timeout
  # the ARM runner. Re-enable once webkit artifacts are cached in cache.projectbluefin.io.
  .github/workflows/build.yml:
    ignore:
      - 'constant expression .+ in condition'

  # RUNNER_TEMP is user-writable, and cleanup() is invoked indirectly by trap.
  .github/workflows/boot-test-aarch64.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2024:.+'
      - 'shellcheck reported issue in this script: SC2317:.+'

  # These single-quoted strings are intentionally literal Markdown/awk text.
  .github/workflows/lts-branch-status.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'

  .github/workflows/stable-publish.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'

  .github/workflows/stable-vulnerability-scan.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'

  .github/workflows/testing-lts-build.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'

  .github/workflows/testing-lts-publish.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'

  .github/workflows/testing-lts-vulnerability-scan.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
