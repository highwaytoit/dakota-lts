name: Local Dakota build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dakota-local-worker
  cancel-in-progress: false

jobs:
  build-default:
    name: Build default image on worker-dakota
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dakota-worker
    timeout-minutes: 720

    env:
      BUILD_GAMING: "false"

    steps:
      - name: Checkout testing-lts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing-lts

      - name: Verify local worker
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          podman --version
          buildah --version
          skopeo --version
          crun --version
          podman info --format 'rootless={{.Host.Security.Rootless}} graphDriver={{.Store.GraphDriverName}}'
          ls -l /dev/fuse
          nproc
          free -h
          df -hT /
          mkdir -p "${HOME}/.cache/buildstream"
          du -sh "${HOME}/.cache/buildstream" || true

      - name: Track Linux 6.18 LTS
        shell: bash
        run: |
          set -euo pipefail
          just bst source track core/linux-fdsdk.bst

          KERNEL_TRACK=$(awk '/^[[:space:]]*track: / { print $2; exit }' elements/core/linux-fdsdk.bst)
          KERNEL_REF=$(awk '/^[[:space:]]*ref: / { print $2; exit }' elements/core/linux-fdsdk.bst)

          if [ "$KERNEL_TRACK" != "v6.18.*" ]; then
            echo "::error::Kernel track escaped Linux 6.18 LTS: $KERNEL_TRACK"
            exit 1
          fi
          if [[ ! "$KERNEL_REF" =~ ^v6\.18\.[0-9]+-0-g[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved kernel is not a stable Linux 6.18 point release: $KERNEL_REF"
            exit 1
          fi

          echo "Resolved Linux LTS source: $KERNEL_REF"
          echo "Linux LTS source: `$KERNEL_REF`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve BuildStream graph
        shell: bash
        run: |
          set -euo pipefail
          just bst show --deps all --format "%{name}" oci/bluefin.bst | tee /tmp/dakota-elements.txt
          echo "Element count: $(wc -l < /tmp/dakota-elements.txt)"

      - name: Build default OCI image locally
        shell: bash
        run: |
          set -euo pipefail
          just bst build oci/bluefin.bst

      - name: Report cache and disk usage
        if: always()
        shell: bash
        run: |
          df -hT /
          du -sh "${HOME}/.cache/buildstream" || true