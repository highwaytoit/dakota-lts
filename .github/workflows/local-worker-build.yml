name: Local Dakota build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant to build on worker-dakota
        required: true
        default: default
        type: choice
        options:
          - default
          - nvidia
  workflow_call:
    inputs:
      variant:
        required: false
        type: string
        default: default

permissions:
  contents: read

concurrency:
  group: dakota-local-worker
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.variant }} image on worker-dakota
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dakota-worker
    timeout-minutes: 720
    env:
      BUILD_GAMING: "false"

    steps:
      - name: Checkout testing-lts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing-lts

      - name: Select build variant
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.variant }}" in
            default)
              ELEMENT="oci/bluefin.bst"
              ;;
            nvidia)
              ELEMENT="oci/bluefin-nvidia.bst"
              ;;
            *)
              echo "::error::Unsupported local worker variant: ${{ inputs.variant }}"
              exit 1
              ;;
          esac
          echo "ELEMENT=$ELEMENT" >> "$GITHUB_ENV"
          echo "Selected variant: ${{ inputs.variant }} ($ELEMENT)"

      - name: Verify local worker
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          podman --version
          buildah --version
          skopeo --version
          crun --version
          podman info --format 'rootless={{.Host.Security.Rootless}} graphDriver={{.Store.GraphDriverName}}'
          ls -l /dev/fuse
          nproc
          free -h
          df -hT /
          mkdir -p "${HOME}/.cache/buildstream"
          du -sh "${HOME}/.cache/buildstream" || true

      - name: Track Linux 6.18 LTS
        shell: bash
        run: |
          set -euo pipefail
          just bst source track core/linux-fdsdk.bst

          KERNEL_TRACK=$(awk '/^[[:space:]]*track: / { print $2; exit }' elements/core/linux-fdsdk.bst)
          KERNEL_REF=$(awk '/^[[:space:]]*ref: / { print $2; exit }' elements/core/linux-fdsdk.bst)

          if [ "$KERNEL_TRACK" != "v6.18.*" ]; then
            echo "::error::Kernel track escaped Linux 6.18 LTS: $KERNEL_TRACK"
            exit 1
          fi
          if [[ ! "$KERNEL_REF" =~ ^v6\.18\.[0-9]+-0-g[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved kernel is not a stable Linux 6.18 point release: $KERNEL_REF"
            exit 1
          fi

          echo "Resolved Linux LTS source: $KERNEL_REF"
          printf 'Linux LTS source: `%s`\n' "$KERNEL_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve NVIDIA R580 LTS
        if: inputs.variant == 'nvidia'
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED=$(python3 scripts/resolve_nvidia_lts.py)
          echo "Resolved NVIDIA LTS source: $RESOLVED"
          printf 'NVIDIA LTS source: `%s`\n' "$RESOLVED" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve BuildStream graph
        shell: bash
        run: |
          set -euo pipefail
          just bst show --deps all --format "%{name}" "$ELEMENT" | tee /tmp/dakota-elements.txt
          echo "Element count: $(wc -l < /tmp/dakota-elements.txt)"

      - name: Build selected OCI image locally
        shell: bash
        run: |
          set -euo pipefail
          just bst build "$ELEMENT"

      - name: Export finalized OCI image
        shell: bash
        run: |
          set -euo pipefail
          just export "${{ inputs.variant }}"

      - name: Generate bootable raw disk
        shell: bash
        run: |
          set -euo pipefail
          just generate-bootable-image "${{ inputs.variant }}"

      - name: Convert raw disk to qcow2
        shell: bash
        run: |
          set -euo pipefail
          just convert-to-qcow2

      - name: Verify qcow2
        shell: bash
        run: |
          set -euo pipefail
          test -s bootable.qcow2
          ls -lh bootable.raw bootable.qcow2
          sha256sum bootable.qcow2 > bootable.qcow2.sha256
          cat bootable.qcow2.sha256
          if command -v qemu-img >/dev/null 2>&1; then
            qemu-img info bootable.qcow2
          fi

      - name: Upload qcow2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dakota-lts-${{ inputs.variant }}-qcow2
          path: |
            bootable.qcow2
            bootable.qcow2.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Report cache and disk usage
        if: always()
        shell: bash
        run: |
          df -hT /
          du -sh "${HOME}/.cache/buildstream" || true

