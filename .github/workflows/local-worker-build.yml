name: Local Dakota build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant to build on worker-dakota
        required: true
        default: default
        type: choice
        options:
          - default
          - nvidia
  workflow_call:
    inputs:
      variant:
        required: false
        type: string
        default: default

permissions:
  contents: read
  packages: write

concurrency:
  group: dakota-local-worker
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.variant }} image on worker-dakota
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dakota-worker
    timeout-minutes: 720
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

    env:
      BUILD_GAMING: "false"

    steps:
      - name: Checkout testing-lts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing-lts

      - name: Select build variant
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.variant }}" in
            default)
              ELEMENT="oci/bluefin.bst"
              IMAGE_TAG="testing"
              ;;
            nvidia)
              ELEMENT="oci/bluefin-nvidia.bst"
              IMAGE_TAG="testing-nvidia"
              ;;
            *)
              echo "::error::Unsupported local worker variant: ${{ inputs.variant }}"
              exit 1
              ;;
          esac
          echo "ELEMENT=$ELEMENT" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Selected variant: ${{ inputs.variant }} ($ELEMENT)"

      - name: Verify local worker
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          podman --version
          buildah --version
          skopeo --version
          crun --version
          podman info --format 'rootless={{.Host.Security.Rootless}} graphDriver={{.Store.GraphDriverName}}'
          ls -l /dev/fuse
          nproc
          free -h
          df -hT /
          mkdir -p "${HOME}/.cache/buildstream"
          du -sh "${HOME}/.cache/buildstream" || true

      - name: Track Linux 6.18 LTS
        shell: bash
        run: |
          set -euo pipefail
          just bst source track core/linux-fdsdk.bst

          KERNEL_TRACK=$(awk '/^[[:space:]]*track: / { print $2; exit }' elements/core/linux-fdsdk.bst)
          KERNEL_REF=$(awk '/^[[:space:]]*ref: / { print $2; exit }' elements/core/linux-fdsdk.bst)

          if [ "$KERNEL_TRACK" != "v6.18.*" ]; then
            echo "::error::Kernel track escaped Linux 6.18 LTS: $KERNEL_TRACK"
            exit 1
          fi
          if [[ ! "$KERNEL_REF" =~ ^v6\.18\.[0-9]+-0-g[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved kernel is not a stable Linux 6.18 point release: $KERNEL_REF"
            exit 1
          fi

          echo "Resolved Linux LTS source: $KERNEL_REF"
          printf 'Linux LTS source: `%s`\n' "$KERNEL_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve NVIDIA R580 LTS
        if: inputs.variant == 'nvidia'
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED=$(python3 scripts/resolve_nvidia_lts.py)
          echo "Resolved NVIDIA LTS source: $RESOLVED"
          printf 'NVIDIA LTS source: `%s`\n' "$RESOLVED" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve BuildStream graph
        shell: bash
        run: |
          set -euo pipefail
          just bst show --deps all --format "%{name}" "$ELEMENT" | tee /tmp/dakota-elements.txt
          echo "Element count: $(wc -l < /tmp/dakota-elements.txt)"

      - name: Build selected OCI image locally
        shell: bash
        run: |
          set -euo pipefail
          just bst build "$ELEMENT"

      - name: Checkout OCI layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vm-oci
          just bst artifact checkout "$ELEMENT" --directory /src/.vm-oci
          test -f .vm-oci/index.json
          test -f .vm-oci/oci-layout

      - name: Publish test image to GHCR
        id: publish
        shell: bash
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/dakota-lts:$IMAGE_TAG"
          skopeo copy --all             --dest-creds "$GH_ACTOR:$GH_TOKEN"             "oci:${PWD}/.vm-oci"             "docker://$IMAGE_REF"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf 'Test image: `%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Report cache and disk usage
        if: always()
        shell: bash
        run: |
          df -hT /
          du -sh "${HOME}/.cache/buildstream" || true

  qcow2:
    name: Create downloadable qcow2
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        shell: bash
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Build qcow2
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36
        with:
          bootc_ref: ${{ needs.build.outputs.image_ref }}
          bootc_default_fs: btrfs
          image_type: qcow2

      - name: Collect VM disk
        shell: bash
        run: |
          set -euo pipefail
          QCOW=$(find output -type f -name '*.qcow2' -print -quit)
          if [ -z "$QCOW" ]; then
            echo "::error::No qcow2 produced"
            find output -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$QCOW" "dakota-lts-${{ inputs.variant }}.qcow2"
          sha256sum "dakota-lts-${{ inputs.variant }}.qcow2" > "dakota-lts-${{ inputs.variant }}.qcow2.sha256"

      - name: Upload VM disk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dakota-lts-${{ inputs.variant }}-qcow2
          path: |
            dakota-lts-${{ inputs.variant }}.qcow2
            dakota-lts-${{ inputs.variant }}.qcow2.sha256
          retention-days: 7
          if-no-files-found: error
