name: COSMIC release resolver tests

on:
  push:
    branches:
      - cosmic-lts-integration
    paths:
      - scripts/cosmic_release_audit.py
      - scripts/test_cosmic_release_audit.py
      - scripts/cosmic_source_sync.py
      - scripts/test_cosmic_source_sync.py
      - elements/cosmic-core/**
      - elements/cosmic/**
      - elements/cosmic-build-meta.bst
      - cosmic/**
      - .github/workflows/cosmic-release-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-tests:
    name: Offline COSMIC resolver tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile resolver and test source
        run: python3 -m py_compile scripts/cosmic_release_audit.py scripts/test_cosmic_release_audit.py scripts/cosmic_source_sync.py scripts/test_cosmic_source_sync.py
      - name: Run offline regression tests
        run: python3 -m unittest discover -s scripts -p 'test_cosmic_*.py' -v
      - name: Confirm baseline structure
        run: |
          python3 -c 'import json; x=json.load(open("cosmic/release-baseline.json")); assert x["release"].startswith("epoch-"); assert len(x["components"]) == len({v["id"] for v in x["components"]}); print("Baseline:",x["release"],len(x["components"]),"unique upstream identities")'

  live-audit:
    name: Audit latest stable COSMIC release
    needs: resolver-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Synchronize latest stable COSMIC supplemental sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_source_sync.py --write
      - name: Resolve latest stable COSMIC release and audit recipe coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_release_audit.py --report cosmic-audit.json
      - name: Upload component audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-release-component-audit
          path: cosmic-audit.json
          if-no-files-found: warn
          retention-days: 14

  graph-validation:
    name: Validate COSMIC desktop and system BuildStream graphs
    needs: live-audit
    runs-on: [self-hosted, Linux, X64, dakota-worker]
    timeout-minutes: 60
    concurrency:
      group: dakota-testing-lts-worker
      cancel-in-progress: false
    env:
      BUILD_GAMING: "false"
      BST_FLAGS: "--config /src/.github/buildstream-worker.conf"
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update supplemental COSMIC source snapshots in local checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_source_sync.py --write
      - name: Validate shared COSMIC desktop dependency graph
        run: just bst show --deps all --format "%{name}" cosmic/desktop.bst > /tmp/dakota-cosmic-desktop-graph.txt
      - name: Validate shared COSMIC system dependency graph
        run: just bst show --deps all --format "%{name}" cosmic/system.bst > /tmp/dakota-cosmic-system-graph.txt
      - name: Report graph sizes and kernel entries
        run: |
          echo "Desktop elements: $(wc -l < /tmp/dakota-cosmic-desktop-graph.txt)"
          echo "System elements: $(wc -l < /tmp/dakota-cosmic-system-graph.txt)"
          grep -E 'linux-fdsdk.bst|linux-ogc.bst|cosmic-core/' /tmp/dakota-cosmic-system-graph.txt || true
