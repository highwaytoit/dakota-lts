name: COSMIC Mesa experimental build

on:
  push:
    branches:
      - cosmic-lts-integration
    paths:
      - .github/workflows/cosmic-mesa-build.yml
      - scripts/cosmic_ci_plugin.py
      - scripts/cosmic_source_sync.py
      - elements/cosmic-core/cosmic-viewer.bst
      - patches/cosmic-build-meta/0002-dulwich-worktree.patch
      - patches/cosmic-build-meta/0003-cosmic-applets-serial-rust.patch

permissions:
  contents: read

# Share the existing Dakota worker with the normal LTS workflows.
concurrency:
  group: dakota-testing-lts-worker
  cancel-in-progress: false

jobs:
  build-cosmic-mesa:
    name: Build COSMIC Mesa OCI without publishing
    runs-on: [self-hosted, Linux, X64, dakota-worker]
    timeout-minutes: 720
    env:
      BUILD_GAMING: "false"
      BST_FLAGS: "--config /src/.github/buildstream-worker.conf"
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate COSMIC recipe and plugin isolation regression checks
        run: python3 -m unittest discover -s scripts -p 'test_cosmic_*.py' -v

      - name: Synchronize supplemental COSMIC stable sources and Rust dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_source_sync.py --write

      - name: Audit official stable components and stop on unsupported changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_release_audit.py --report cosmic-audit.json

      - name: Align Razorfin component recipes with official stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cosmic_upstream_sync.py

      - name: Select verified COSMIC Cargo plugin in disposable runner checkout
        run: |
          python3 scripts/cosmic_ci_plugin.py
          git diff -- project.conf

      - name: Verify COSMIC Mesa OCI graph before compilation
        run: just bst show --deps all --format "%{name}" cosmic/image.bst > /tmp/dakota-cosmic-mesa-elements.txt

      - name: Confirm both patched Cargo Git checkout call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".bst/staged-junctions/cosmic-build-meta.bst")
          candidates = list(root.glob("*/plugins/local/sources/cargo2.py"))
          assert candidates, "COSMIC junction's staged Cargo source plugin was not found"
          validated = []
          for plugin in candidates:
              text = plugin.read_text(encoding="utf-8")
              calls = [line.strip() for line in text.splitlines()]
              if calls.count("dest.get_worktree().reset_index()") == 1 and calls.count("sub_dest.get_worktree().reset_index()") == 1:
                  validated.append(str(plugin))
          assert validated, "Neither Cargo checkout call site is patched in the staged COSMIC junction"
          ready = []
          for plugin in validated:
              staged = Path(plugin).parents[3]
              applets = staged / "elements" / "core" / "cosmic-applets.bst"
              if applets.is_file() and "CARGO_BUILD_JOBS=1 just build-release" in applets.read_text(encoding="utf-8"):
                  ready.append(str(applets))
          assert ready, "COSMIC Applets single-job patch not found in staged junction"
          for name in ("cosmic-monitor", "cosmic-osk", "cosmic-viewer"):
              recipe = Path("elements/cosmic-core") / (name + ".bst")
              assert "url: 'crates:crates/'" in recipe.read_text(encoding="utf-8"), name + " crate path not corrected"
          viewer = Path("elements/cosmic-core/cosmic-viewer.bst").read_text(encoding="utf-8")
          assert "- freedesktop-sdk.bst:components/make.bst" in viewer, "Viewer GNU Make dependency missing"
          print("Validated Dulwich, Applets, three Rust crate sources, and Viewer GNU Make dependency")
          PY

      - name: Record worker memory before compilation
        run: |
          free -h
          for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
            if [ -r "$file" ]; then
              echo "$file"
              cat "$file"
            fi
          done

      - name: Show cached COSMIC Mesa graph state before building
        run: just bst show --format "%{name} %{state}" cosmic/image.bst

      - name: Build complete COSMIC Mesa OCI artifact
        run: just bst build cosmic/image.bst

      - name: Check cached COSMIC Mesa OCI artifact
        run: just bst show --format "%{state}" cosmic/image.bst

      - name: Report worker memory and disk without pruning caches
        if: always()
        run: |
          free -h
          df -h / /home
          for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
            if [ -r "$file" ]; then
              echo "$file"
              cat "$file"
            fi
          done

      - name: Upload official component audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-mesa-stage4-component-audit
          path: cosmic-audit.json
          if-no-files-found: warn
          retention-days: 14
